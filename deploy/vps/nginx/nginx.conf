worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 2m;
    server_tokens off;

    log_format koz_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"status":$status,'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log koz_json;

    # Active upstream file is swapped by scripts/vps/nginx-switch-*.sh
    include /etc/nginx/conf.d/active-upstream.conf;
    include /etc/nginx/conf.d/upstreams.conf;
    include /etc/nginx/conf.d/koz-api.conf;
}
