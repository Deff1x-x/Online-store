name: CI Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NODE_ENV: test

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: koz_test
          POSTGRES_USER: koz_ci
          POSTGRES_PASSWORD: ci_test_password_not_real
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koz_ci -d koz_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend-dotnet/Koz.sln

      - name: Build (Release)
        run: dotnet build backend-dotnet/Koz.sln -c Release --no-restore -warnaserror

      - name: Unit tests
        run: dotnet test backend-dotnet/tests/Koz.Api.Tests/Koz.Api.Tests.csproj -c Release --no-build --no-restore

      - name: Publish
        run: dotnet publish backend-dotnet/src/Koz.Api/Koz.Api.csproj -c Release -o publish --no-restore /p:UseAppHost=false

      - name: Fresh DB (schema + migrations + seed)
        env:
          PGPASSWORD: ci_test_password_not_real
        run: |
          psql -h localhost -U koz_ci -d koz_test -v ON_ERROR_STOP=1 -f database/schema.sql
          for f in database/migrations/*.sql; do
            psql -h localhost -U koz_ci -d koz_test -v ON_ERROR_STOP=1 -f "$f"
          done
          if [ -f database/seed.sql ]; then
            psql -h localhost -U koz_ci -d koz_test -v ON_ERROR_STOP=1 -f database/seed.sql
          fi

      - name: Integration tests
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=koz_test;Username=koz_ci;Password=ci_test_password_not_real"
          KOZ_INTEGRATION_CONNECTION: "Host=localhost;Port=5432;Database=koz_test;Username=koz_ci;Password=ci_test_password_not_real"
        run: dotnet test backend-dotnet/tests/Koz.IntegrationTests/Koz.IntegrationTests.csproj -c Release --no-build --no-restore || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Typecheck
        run: |
          npx tsc -p apps/client --noEmit
          npx tsc -p apps/staff --noEmit
          npx tsc -p packages/api --noEmit

      - name: Tests
        run: npm run test --workspace=@koz/client

      - name: Build client
        run: npm run build --workspace=@koz/client

      - name: Build staff
        run: npm run build --workspace=@koz/staff

  acceptance:
    name: API acceptance
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: koz_acceptance
          POSTGRES_USER: koz_ci
          POSTGRES_PASSWORD: ci_test_password_not_real
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koz_ci -d koz_acceptance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare DB
        env:
          PGPASSWORD: ci_test_password_not_real
        run: |
          psql -h localhost -U koz_ci -d koz_acceptance -v ON_ERROR_STOP=1 -f database/schema.sql
          for f in database/migrations/*.sql; do
            psql -h localhost -U koz_ci -d koz_acceptance -v ON_ERROR_STOP=1 -f "$f"
          done
          if [ -f database/seed.sql ]; then
            psql -h localhost -U koz_ci -d koz_acceptance -v ON_ERROR_STOP=1 -f database/seed.sql
          fi

      - name: Publish .NET API
        run: dotnet publish backend-dotnet/src/Koz.Api/Koz.Api.csproj -c Release -o /tmp/koz-api /p:UseAppHost=false

      - name: Start .NET API
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5000
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_NAME: koz_acceptance
          DATABASE_USER: koz_ci
          DATABASE_PASSWORD: ci_test_password_not_real
          JWT_SECRET: ci-only-jwt-secret-not-for-production-use-32chars
          OTP_SECRET: ci-only-otp-hmac-secret-not-for-production-32c
          Cors__AllowedOrigins__0: http://localhost:5173
          Cors__AllowedOrigins__1: http://localhost:5174
        run: |
          dotnet /tmp/koz-api/Koz.Api.dll &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/health >/dev/null; then
              echo "dotnet_api_ready"
              exit 0
            fi
            sleep 1
          done
          echo "dotnet_api_failed_to_start" >&2
          exit 1

      - name: Assert product API is .NET :5000
        run: |
          curl -fsS http://127.0.0.1:5000/api/health
          if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
            echo "Node must not be the acceptance target" >&2
            exit 1
          fi

      - name: A7 acceptance
        env:
          KOZ_E2E_API_URL: http://127.0.0.1:5000/api
        run: node scripts/tz/a7-f0-acceptance.mjs

      - name: B7 API acceptance
        env:
          KOZ_E2E_API_URL: http://127.0.0.1:5000/api
        run: node scripts/tz/b7-acceptance.mjs

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose config
        run: |
          docker compose -f deploy/vps/docker-compose.yml config --quiet
          docker compose -f deploy/local/docker-compose.yml config --quiet

      - name: Build .NET image
        run: docker build -f backend-dotnet/Dockerfile -t koz-api:ci backend-dotnet

      - name: Build Node image
        run: docker build -f Dockerfile.node -t koz-node:ci .


  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Secret scan
        run: node scripts/tz/secret-scan.mjs

      - name: git diff --check
        run: git diff --check HEAD~1 || true

      - name: npm audit
        run: npm audit --audit-level=high || true

      - name: Matrix recount
        run: node scripts/tz/matrix-recount.mjs

      - name: Shell script validation
        run: |
          find scripts/vps -name '*.sh' -exec bash -n {} \;
          echo "shell_syntax_ok"
